name: "Human Escalation Request"
description: "Requests human intervention when automated migration fails"
template: |
  **HUMAN ESCALATION REQUIRED**

  The automated migration system has encountered an issue that requires human expertise.

  **Escalation Context:**
  - **Project:** {project_name}
  - **File:** {file_path}
  - **Migration Step:** {current_step}
  - **Escalation Reason:** {escalation_reason}

  **Problem Summary:**
  {problem_description}

  **What We've Tried:**
  {attempted_solutions}

  **Current State:**
  ```java
  {current_code}
  ```

  **Error Details:**
  ```
  {error_details}
  ```

  **Migration Context:**
  - **Target Java Version:** {target_version}
  - **Applied Recipes:** {applied_recipes}
  - **Previous Changes:** {previous_changes}

  **Human Input Needed:**
  {specific_questions}

  **Suggested Next Steps:**
  {suggested_actions}

  **Options for Human Response:**
  1. **PROVIDE_SOLUTION**: Give specific code fix or guidance
  2. **SKIP_FILE**: Skip this file and continue with migration
  3. **ABORT_MIGRATION**: Stop the entire migration process
  4. **CUSTOM_RECIPE**: Create a custom migration recipe for this case
  5. **MANUAL_REVIEW**: Mark for manual review after automation completes

  **Please respond with:**
  - Your chosen option (1-5)
  - Specific guidance or code if applicable
  - Any additional context or considerations

variables:
  - name: "project_name"
    type: "string"
    description: "Name of the project being migrated"
    required: true
  - name: "file_path"
    type: "string"
    description: "Path to the problematic file"
    required: true
  - name: "current_step"
    type: "string"
    description: "Current migration step (analysis/recipe/migration/fixing/testing)"
    required: true
  - name: "escalation_reason"
    type: "string"
    description: "Why human intervention is needed"
    required: true
  - name: "problem_description"
    type: "string"
    description: "Detailed description of the problem"
    required: true
  - name: "attempted_solutions"
    type: "string"
    description: "What the system has already tried"
    required: true
  - name: "current_code"
    type: "string"
    description: "Current state of the problematic code"
    required: true
  - name: "error_details"
    type: "string"
    description: "Complete error messages and stack traces"
    required: false
  - name: "target_version"
    type: "string"
    description: "Target Java version"
    required: true
  - name: "applied_recipes"
    type: "string"
    description: "Migration recipes that have been applied"
    required: false
  - name: "previous_changes"
    type: "string"
    description: "Changes made in previous steps"
    required: false
  - name: "specific_questions" 
    type: "string"
    description: "Specific questions for the human reviewer"
    required: true
  - name: "suggested_actions"
    type: "string"
    description: "System's suggested next steps"
    required: true