name: "Build and Validation"
description: "Validates that the migrated project builds and runs correctly"
template: |
  You are a Java build expert. Validate that the migrated project builds successfully and functions correctly.

  **Project Structure:**
  {project_structure}

  **Build Configuration:**
  ```xml
  {build_config}
  ```

  **Migration Summary:**
  ```json
  {migration_summary}
  ```

  **Build Output:**
  ```
  {build_output}
  ```

  **Test Results:**
  ```
  {test_results}
  ```

  **Validation Tasks:**
  1. Analyze build success/failure
  2. Identify any remaining compilation issues
  3. Validate test execution results
  4. Check for runtime warnings or deprecation messages
  5. Verify all dependencies are compatible
  6. Assess overall migration success

  **Output format:**
  Return a JSON object:
  ```json
  {{
    "build_status": {{
      "success": boolean,
      "compilation_errors": number,
      "warnings": number,
      "error_details": ["list of error messages"],
      "warning_details": ["list of warning messages"]
    }},
    "test_status": {{
      "tests_run": number,
      "tests_passed": number,
      "tests_failed": number,
      "test_failures": ["list of failed test descriptions"],
      "coverage_info": "test coverage summary if available"
    }},
    "dependency_status": {{
      "compatible": boolean,
      "conflicts": ["list of dependency conflicts"],
      "missing_dependencies": ["list of missing dependencies"],
      "version_mismatches": ["list of version issues"]
    }},
    "migration_validation": {{
      "overall_success": boolean,
      "success_percentage": number,
      "files_migrated": number,
      "files_with_issues": number,
      "remaining_deprecations": number
    }},
    "recommendations": [
      {{
        "category": "build|test|dependency|migration",
        "priority": "high|medium|low", 
        "issue": "description of issue",
        "solution": "recommended solution",
        "effort": "low|medium|high"
      }}
    ],
    "next_steps": ["ordered list of next actions needed"],
    "rollback_needed": boolean,
    "rollback_reason": "reason if rollback is recommended"
  }}
  ```

variables:
  - name: "project_structure"
    type: "string"
    description: "Project directory structure and file organization"
    required: true
  - name: "build_config"
    type: "string"
    description: "Maven pom.xml or Gradle build configuration"
    required: true
  - name: "migration_summary"
    type: "string"
    description: "Summary of all migration changes made"
    required: true
  - name: "build_output"
    type: "string"
    description: "Complete build command output"
    required: true
  - name: "test_results"
    type: "string"
    description: "Test execution results and output"
    required: false