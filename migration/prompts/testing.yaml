name: "Migration Testing and Validation"
description: "Creates and runs tests to validate migration success"
template: |
  You are a Java testing expert. Create and validate tests for the migrated code.

  **Migrated Code:**
  ```java
  {migrated_code}
  ```

  **Original Code (for comparison):**
  ```java
  {original_code}
  ```

  **Migration Summary:**
  ```json
  {migration_summary}
  ```

  **Testing Requirements:**
  1. Verify that migrated code maintains original functionality
  2. Test deprecated API replacements work correctly
  3. Validate performance hasn't degraded significantly
  4. Ensure error handling remains intact
  5. Check edge cases and boundary conditions

  **Task:**
  1. Generate unit tests that validate the migration
  2. Create integration tests if needed
  3. Suggest manual testing scenarios
  4. Identify potential regression risks

  **Output format:**
  Return a JSON object:
  ```json
  {{
    "unit_tests": [
      {{
        "test_name": "descriptive test name",
        "test_code": "complete JUnit test code",
        "purpose": "what this test validates",
        "test_type": "functionality|performance|edge_case|integration"
      }}
    ],
    "manual_tests": [
      {{
        "scenario": "description of manual test scenario",
        "steps": ["step 1", "step 2", "..."],
        "expected_result": "what should happen",
        "validation_points": ["what to check"]
      }}
    ],
    "regression_risks": [
      {{
        "area": "code area with risk",
        "risk_level": "low|medium|high",
        "description": "what could break",
        "mitigation": "how to prevent/test for this"
      }}
    ],
    "performance_benchmarks": [
      {{
        "operation": "operation to benchmark",
        "benchmark_code": "code to measure performance",
        "baseline_expectation": "expected performance range"
      }}
    ],
    "test_execution": {{
      "compilation_command": "command to compile tests",
      "execution_command": "command to run tests",
      "success_criteria": "how to determine if tests pass"
    }}
  }}
  ```

variables:
  - name: "migrated_code"
    type: "string"
    description: "Java code after migration"
    required: true
  - name: "original_code"
    type: "string"
    description: "Original Java code before migration"
    required: true
  - name: "migration_summary"
    type: "string"
    description: "JSON summary of migration changes made"
    required: true